# dsh_superpowers bundle patch for DeepSeek Harness profiles.
#
# Applied automatically when this package is installed through dsh's own plugin
# command — for example
#
#   dsh plugin --profile web add icanfinish11/dsh_superpowers
#   dsh plugin --profile web add link:/path/to/dsh_superpowers
#
# The dsh CLI appends every dependency that declares `dsh.bundle` (see
# package.json) to the profile's `dsh.profile.bundles`, and each bundle's patch
# is layered into the composed configuration on boot. Nothing here edits a
# user's config: the install artifact is the install itself.
#
# The row mounts `index.js`, which
#   1. registers the skills of the dependency `superpowers` (the original
#      author's repository, pinned in package.json) as a dsh skill provider, so
#      the 14 Superpowers skills load with dsh's native `skill` tool, and
#   2. contributes the `using-superpowers` bootstrap — with the dsh tool
#      mapping — as the `superpowers:bootstrap` system-prompt section, so skills
#      auto-trigger from the first turn of every session with no opt-in.

- insert:
    - id: superpowers
      name: 'dsh_superpowers'
      config:
        # Register the skills catalog. false = bootstrap only.
        skills: true
        # Inject the using-superpowers bootstrap into the system prompt.
        bootstrap: true
        # Append the dsh tool mapping to the bootstrap.
        toolMapping: true
        # System-prompt section order (dsh renders sections in ascending order;
        # 100-199 is the tool-and-behavior guidance band).
        order: 121
        # Skills root. Empty = resolve automatically: config → SUPERPOWERS_SKILLS_DIR
        # → <package>/skills → <package>/../skills → the `superpowers` dependency.
        skillsDir: ''
